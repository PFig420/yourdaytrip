[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfsconv"
version = "0.1.0"
description = "Aveiro bus + ferry timetables (CSV) to one static GTFS feed"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["gtfsconv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
